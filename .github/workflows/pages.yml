name: pages

# Serves every schema at its `$id`. A schema whose `$id` returns 404 is a dangling identifier,
# which is what 1.0.x shipped: https://cognitivedelivery.co.uk/contract/1.0.0/… never existed.
#
# Two kinds of directory, from one deploy:
#   /<major>.x/        the current schemas on main, which every `$id` names (the 1.x alias)
#   /<version>/        the schemas AS TAGGED, one directory per v1.* tag, byte for byte, never
#                      rewritten: a reader that pinned 1.1.0 can fetch exactly what 1.1.0 shipped
# plus `index.json` beside each set, and the documentation site (`tooling/build-site.mjs`: the
# front page, the guides, the SPEC, the schema reference, conformance, proposals and versions,
# every page generated from files `npm test` checks). Nothing is committed anywhere for the site;
# the schema bytes are laid out from `schemas/` on main and from each tag's `schemas/` at deploy
# time, and the generator never writes a JSON file, so there is nothing to drift. Runs on a push to main and on dispatch; release.yml dispatches it
# after publishing, so a release's frozen copy appears when the release does. (A tag push cannot
# deploy directly: the github-pages environment's branch policy admits `main` only, and the
# v1.2.0 tag run was refused at the deploy step for exactly that reason.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lay out the site from main and from every v1.* tag
        run: |
          set -e
          MAJOR="$(node -p "require('./package.json').version.split('.')[0]")"
          mkdir -p "_site/${MAJOR}.x"
          cp schemas/*.schema.json "_site/${MAJOR}.x/"
          [ -f schemas/index.json ] && cp schemas/index.json "_site/${MAJOR}.x/"
          git fetch --tags --quiet
          for tag in $(git tag -l "v${MAJOR}.*" | sort -V); do
            version="${tag#v}"
            mkdir -p "_site/${version}"
            for f in $(git ls-tree --name-only "${tag}:schemas" | grep -E '\.json$'); do
              git show "${tag}:schemas/${f}" > "_site/${version}/${f}"
            done
            echo "froze ${tag} -> /${version}/ ($(ls "_site/${version}" | wc -l) files)"
          done

      - name: Build the site pages from the tree (the generator writes no JSON; the schema bytes above are untouched)
        run: |
          set -e
          npm ci
          node tooling/build-site.mjs _site
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
