name: pages

# Serves every schema at its `$id`. A schema whose `$id` returns 404 is a dangling identifier,
# which is what 1.0.x shipped: https://cognitivedelivery.co.uk/contract/1.0.0/… never existed.
#
# The site is built from `schemas/` at the commit being deployed and holds nothing else: no
# copy of the schemas is committed anywhere, so there is nothing to drift. Pages must be
# enabled on the repository with source "GitHub Actions" (Settings → Pages); until it is, this
# workflow fails at the deploy step and the schemas keep validating locally exactly as before.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # One directory per major, named as `$id` names it (`1.x`), plus a plain index.
      - name: Lay out the site from schemas/
        run: |
          MAJOR="$(node -p "require('./package.json').version.split('.')[0]")"
          mkdir -p "_site/${MAJOR}.x"
          cp schemas/*.schema.json "_site/${MAJOR}.x/"
          node -e '
            const fs = require("fs");
            const major = process.argv[1];
            const files = fs.readdirSync(`_site/${major}.x`).sort();
            for (const f of files) {
              const id = JSON.parse(fs.readFileSync(`_site/${major}.x/${f}`, "utf8")).$id;
              const wanted = `https://cognitive-delivery.github.io/contract/${major}.x/${f}`;
              if (id !== wanted) { console.error(`${f}: $id is ${id}, not ${wanted}`); process.exit(1); }
            }
            const items = files.map((f) => `<li><a href="${major}.x/${f}">${f}</a></li>`).join("\n");
            fs.writeFileSync("_site/index.html", `<!doctype html><meta charset="utf-8"><title>Cognitive Delivery governance contract</title><h1>Cognitive Delivery governance contract</h1><p>The schema set, served at each schema\x27s <code>$id</code>. Source, corpus and specification: <a href="https://github.com/Cognitive-Delivery/contract">github.com/Cognitive-Delivery/contract</a>.</p><ul>${items}</ul>`);
          ' "$MAJOR"
          ls -R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
