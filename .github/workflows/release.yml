name: release

# Publishes to npm when a v* tag is pushed, through npm trusted publishing: GitHub Actions
# proves its identity to npm over OIDC, so there is no long-lived token in a repository
# secret to leak or rotate. Provenance is attached, which is the point. A contract that
# asks other people to record what produced an artefact should be able to show what
# produced its own.
#
# Trusted publishing is configured per package at npmjs.com/package/@cognitive-delivery/
# contract/access, which requires the package to exist. The first 1.0.0 is therefore
# published by hand; every release after it comes through here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to create the GitHub Release for the tag; nothing else is written
  id-token: write # the OIDC token npm checks. Without it the publish is unauthenticated.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later, which is newer than the npm bundled
      # with the Node versions Actions ships.
      - run: npm install -g npm@latest

      - run: npm ci

      # Nothing is published that has not passed the corpus and the additive-only guard.
      # A release is the last moment the promise in the README can still be kept.
      - run: npm test
      - run: node ./check-additive.mjs --baseline-ref HEAD^

      # The tag and the version in package.json must agree, or the registry records a
      # version no tag points at.
      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG."
            exit 1
          fi
          echo "Publishing $PKG."

      # `--provenance` here rather than in publishConfig.provenance. Setting it in
      # package.json makes EVERY publish demand a CI provider, so a publish from a
      # laptop fails with "Automatic provenance generation not supported for
      # provider: null" — which is exactly how 1.0.0 got stuck, because the first
      # release of a package has to go out by hand (trusted publishing is
      # configured per package and needs the package to exist). CI still attests
      # every release; a hand publish is now possible when it has to be.
      - run: npm publish --provenance

      # The GitHub Release for the tag: the CHANGELOG section as its notes, the tarball a
      # consumer would install attached, and where the provenance can be checked. Until 1.1.0 no
      # release had ever been cut here — the tag existed, the npm version existed, and the
      # repository's Releases page said "none" — so a reader on GitHub could not tell a version
      # had shipped. Creating one that already exists is an edit, so a re-run is safe.
      - name: GitHub Release with notes, tarball and provenance links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node tooling/changelog-section.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "---"
            echo "npm: https://www.npmjs.com/package/@cognitive-delivery/contract/v/${VERSION}"
            echo "Provenance: published from this workflow run with \`npm publish --provenance\`; verify with \`npm audit signatures\` after installing, or search Sigstore for \`pkg:npm/%40cognitive-delivery/contract@${VERSION}\`."
            echo "Schemas: https://cognitive-delivery.github.io/contract/${VERSION%%.*}.x/"
          } >> "$RUNNER_TEMP/notes.md"
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg" > /dev/null
          TARBALL="$(ls "$RUNNER_TEMP"/pkg/*.tgz)"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$GITHUB_REF_NAME" "$TARBALL" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TARBALL" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi

      # Every `$id` must serve the bytes of the schema it names. Pages deploys from main on push,
      # so at the tag the served file and the tagged file are the same commit's. A 404 means Pages
      # is not enabled yet and is reported, not failed, because the owner enables it and a release
      # is not the moment to discover that; a 200 with different bytes IS a failure, because a
      # reader resolving the identifier would get a schema this release did not ship.
      - name: Each $id serves the tagged schema
        run: |
          MAJOR="$(node -p "require('./package.json').version.split('.')[0]")"
          status=0
          for f in schemas/*.schema.json; do
            name="$(basename "$f")"
            url="https://cognitive-delivery.github.io/contract/${MAJOR}.x/${name}"
            code="$(curl -s -o /tmp/served.json -w '%{http_code}' "$url")"
            if [ "$code" = "404" ]; then
              echo "::warning::${url} returned 404: GitHub Pages is not enabled on this repository yet (Settings → Pages → Source: GitHub Actions)."
              continue
            fi
            if [ "$code" != "200" ]; then
              echo "::error::${url} returned ${code}"; status=1; continue
            fi
            if ! cmp -s /tmp/served.json "$f"; then
              echo "::error::${url} serves different bytes from ${f} at this tag"; status=1
            else
              echo "${url}: 200, bytes identical"
            fi
          done
          exit $status
