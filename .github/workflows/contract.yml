name: contract

# The README says a test fails the build when the additive-only rule is broken.
# This is that build. It runs on the repository a stranger clones, not only inside a product.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: conformance corpus
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Every valid fixture accepted, every invalid one rejected with a written reason, an
      # unknown field surviving a round trip, the canonical-bytes vectors, every schema
      # compiling under Ajv strict mode, the granted-manifest copy identical to its source,
      # the version stated consistently, and the guard's own scenarios.
      - run: npm test

  package:
    name: published package self-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The tarball a consumer installs, not the clone. 1.1.0's package could not run its own
      # `npm test`: two files it imported were not in `files`. Nothing in the clone's test can see
      # that, because the clone has every file. So: pack, install into an empty directory with the
      # optional ajv peer, run the INSTALLED package's test, and import a vector through `exports`.
      - name: Pack, install into an empty directory, run the installed test
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/consumer"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pkg/cognitive-delivery-contract-*.tgz ajv@^8
          npm test --prefix node_modules/@cognitive-delivery/contract
          node --input-type=module -e "
            const m = await import('@cognitive-delivery/contract/conformance/narrowing-vectors.json', { with: { type: 'json' } });
            const lock = await import('@cognitive-delivery/contract/schemas.lock.json', { with: { type: 'json' } });
            console.log('exports: narrowing vectors', m.default.vectors.length, '; lock format', lock.default.lockFormat);
          "

  compatibility:
    name: additive-only guard
    runs-on: ubuntu-latest
    steps:
      # The comparison is against the shape before this change, so the history is needed.
      # A shallow clone would leave nothing to compare against and quietly pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # On a pull request the baseline is the branch being merged into. On a push it is the
      # commit the push started from (`github.event.before`), not HEAD^: a three-commit push
      # whose first commit broke the rule would otherwise be compared only against its own
      # second commit and pass. When `before` is the zero SHA (a brand-new branch), the
      # baseline is the merge base with main. Either way the lock must also be current, or
      # there is no record of the shape this change started from.
      - name: Compare against the base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            node ./check-additive.mjs --baseline-ref "origin/${{ github.base_ref }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git fetch --no-tags origin main
              BEFORE="$(git merge-base HEAD origin/main)"
              echo "New branch: comparing against the merge base with main ($BEFORE)."
            else
              echo "Comparing against the pushed-from commit $BEFORE."
            fi
            node ./check-additive.mjs --baseline-ref "$BEFORE"
          fi

  regex-portability:
    name: regex portability (RE2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      # Every `pattern` in every schema must compile under RE2, which has no lookahead.
      # Go validators use it unconditionally; a pattern that fails here fails there.
      - run: go run . ../../schemas
        working-directory: tooling/regex-portability

  line-endings:
    name: line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Schemas and fixtures are hashed into schemas.lock.json and compared byte for byte, so a
      # checkout that rewrites line endings can make a conformance run disagree with itself
      # across platforms. .gitattributes pins this; the check is that it still holds.
      - name: No CRLF in tracked text
        run: |
          if git grep -I --files-with-matches $'\r$' -- . ':!*.png' ':!*.jpg'; then
            echo "The files above contain CRLF line endings. See .gitattributes."
            exit 1
          fi
          echo "All tracked text files are LF."
